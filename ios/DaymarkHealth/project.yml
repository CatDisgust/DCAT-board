name: DaymarkHealth
options:
  bundleIdPrefix: com.dcat.daymark
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  DaymarkHealth:
    type: application
    platform: iOS
    sources:
      - Sources
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcat.daymark.health
        PRODUCT_NAME: Daymark Health
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: Config/DaymarkHealth.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Daymark Health
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Daymark 读取你的睡眠、体重和活动能量，用于生成只对你可见的个人状态趋势。
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.dcat.daymark.health
            CFBundleURLSchemes:
              - daymark
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
